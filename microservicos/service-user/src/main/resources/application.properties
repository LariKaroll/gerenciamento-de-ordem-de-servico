spring.config.import=optional:file:.env[.properties]
server.port=8081
spring.application.name=service-user
spring.datasource.url=jdbc:postgresql://localhost:${DB_USER_PORT}/${DB_USER_NAME}?stringtype=unspecified
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Propriedades do JWT
app.jwt.secret=${JWT_SECRET:YVdkNnNYbTFFeTl6Tms4eVZid3A0cTJrNXVoN2RhM2M2ZThmZ2hpamtsbW4=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
